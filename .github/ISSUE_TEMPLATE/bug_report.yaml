name: Issue or idea
description: Report a problem, ask a question, or suggest an improvement for this fork.
body:
  - type: textarea
    id: description
    attributes:
      label: What would you like to report?
      description: Describe the problem or idea in your own words. Screenshots and save files are welcome but optional.
      placeholder: Tell us what happened or what you would like to change.
    validations:
      required: true
